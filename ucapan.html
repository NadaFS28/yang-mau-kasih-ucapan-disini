<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesan untuk Hari Spesialku 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ffc8dd; --pink-d:#ff8fb8; --blue:#bde0fe; --lilac:#d7c6f5; --cream:#fff6ea;
  --ink:#4a3f5c; --ink-soft:#7a6e8c; --glass:rgba(255,255,255,.45); --glass-b:rgba(255,255,255,.75);
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,var(--cream) 0%,#ffe3ee 40%,#e4eeff 75%,#eadffb 100%);
  background-attachment:fixed;overflow-x:hidden;
  padding:clamp(16px,4vw,40px) 16px 96px;
}
/* ---------- floating background ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;display:block;opacity:.65;animation:float var(--d) ease-in-out infinite;animation-delay:var(--l)}
.blob{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;filter:blur(2px)}
.star{font-size:var(--s);line-height:1}
@keyframes float{
  0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}
  33%{transform:translate(28px,-46px) rotate(12deg) scale(1.06)}
  66%{transform:translate(-22px,-18px) rotate(-10deg) scale(.96)}
}
main{position:relative;z-index:1;max-width:620px;margin:0 auto}
/* ---------- hero ---------- */
header{text-align:center;margin:12px 0 28px}
.cake{font-size:4.2rem;display:inline-block;animation:wiggle 3.2s var(--bounce) infinite;cursor:pointer;user-select:none}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1.1;margin-top:6px}
header p{color:var(--ink-soft);margin-top:8px;font-weight:600}
/* ---------- glass ---------- */
.glass{
  background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1.5px solid var(--glass-b);border-radius:28px;
  box-shadow:0 10px 40px rgba(170,140,220,.22),inset 0 1px 0 rgba(255,255,255,.8);
}
form.glass{padding:clamp(20px,5vw,34px)}
.field{margin-bottom:20px}
label{display:block;font-weight:700;margin-bottom:8px;padding-left:6px}
input,textarea{
  width:100%;font:inherit;color:var(--ink);padding:14px 18px;border-radius:20px;
  background:rgba(255,255,255,.65);border:2px solid transparent;outline:none;resize:vertical;
  transition:transform .35s var(--bounce),border-color .25s,box-shadow .25s,background .25s;
}
textarea{min-height:92px}
input::placeholder,textarea::placeholder{color:#b3a9c4}
input:hover,textarea:hover{transform:translateY(-2px)}
input:focus,textarea:focus{
  transform:scale(1.025);background:#fff;border-color:var(--pink-d);
  box-shadow:0 0 0 5px rgba(255,143,184,.25);
}
.btn{
  font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;border:0;border-radius:999px;
  padding:15px 30px;color:#fff;background:linear-gradient(135deg,#ff9ec4,#b69af0);
  box-shadow:0 8px 20px rgba(182,154,240,.45);
  transition:transform .35s var(--bounce),box-shadow .25s,filter .25s;
}
.btn:hover{transform:scale(1.07) rotate(-1.5deg);box-shadow:0 12px 28px rgba(182,154,240,.55);filter:brightness(1.04)}
.btn:active{transform:scale(.92,.88)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ffb3b3,#ff8fa3);padding:8px 16px;font-size:.9rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.thanks{text-align:center;padding:30px 10px;display:none}
.thanks .big{font-size:3.4rem;animation:wiggle 2s var(--bounce) infinite}
.thanks h2{font-family:'Baloo 2';margin:6px 0}
.err{color:#d6456b;font-weight:700;text-align:center;margin-top:12px;min-height:1.2em}
.demo{display:none;background:#fff3cd;color:#7a5c00;border-radius:16px;padding:10px 16px;font-size:.85rem;font-weight:700;margin-bottom:16px;text-align:center}
/* ---------- lock + modal ---------- */
.lock{
  position:fixed;right:18px;bottom:18px;z-index:5;width:50px;height:50px;border-radius:50%;
  border:1.5px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(12px);
  font-size:1.3rem;cursor:pointer;opacity:.45;transition:transform .35s var(--bounce),opacity .25s;
}
.lock:hover{opacity:1;transform:scale(1.2) rotate(-12deg)}
.lock:active{transform:scale(.85)}
.overlay{
  position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(120,100,160,.28);backdrop-filter:blur(6px);
}
.overlay.open{display:flex}
.modal{padding:28px;width:100%;max-width:360px;text-align:center;animation:pop .45s var(--bounce)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-family:'Baloo 2';font-size:1.5rem;margin-bottom:14px}
.modal .row{display:flex;gap:10px;margin-top:16px;justify-content:center}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* ---------- admin ---------- */
.admin{position:fixed;inset:0;z-index:9;display:none;overflow-y:auto;padding:20px 16px 60px;
  background:linear-gradient(135deg,rgba(255,246,234,.94),rgba(228,238,255,.94),rgba(234,223,251,.94))}
.admin.open{display:block}
.admin-in{max-width:760px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar h2{font-family:'Baloo 2';font-size:1.7rem;flex:1;min-width:180px}
.count{background:var(--pink);border-radius:999px;padding:2px 12px;font-size:1rem;margin-left:6px}
.search{margin-bottom:18px}
.card{padding:20px 22px;margin-bottom:16px;animation:pop .5s var(--bounce);transition:transform .35s var(--bounce)}
.card:hover{transform:translateY(-4px) scale(1.012)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card .name{font-family:'Baloo 2';font-weight:800;font-size:1.25rem}
.card .time{font-size:.78rem;color:var(--ink-soft)}
.card .q{margin-top:10px;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.q small{display:block;font-weight:800;margin-bottom:2px}
.q.wish{background:rgba(255,200,221,.55)}
.q.like{background:rgba(189,224,254,.6)}
.q.dislike{background:rgba(215,198,245,.6)}
.empty{text-align:center;padding:40px;color:var(--ink-soft);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<main>
  <header>
    <div class="cake" id="cake" title="Klik aku!">🎂</div>
    <h1>28 OKTOBER 2013</h1>
    <p>Tinggalkan ucapan (harus jujur) buat nanad istri sah kaji 💌</p>
  </header>

  <div class="demo" id="demo">Mode demo: Firebase belum diisi, pesan disimpan di browser ini saja.</div>

  <form class="glass" id="form" autocomplete="off">
    <div class="field">
      <label for="name">Namamu</label>
      <input id="name" maxlength="60" placeholder="Misal : Sugawara Koushi" required>
    </div>
    <div class="field">
      <label for="wish">Ucapan</label>
      <textarea id="wish" maxlength="600" placeholder="Tulis ucapan buat guweh" required></textarea>
    </div>
    <div class="field">
      <label for="like">Apa you suka dari istrinya kaji?</label>
      <textarea id="like" maxlength="600" placeholder="Pasti akeh kie" required></textarea>
    </div>
    <div class="field">
      <label for="dislike">Apa you gak suka dari aing?</label>
      <textarea id="dislike" maxlength="600" placeholder="Jujur aja pasti ga ada 🫣" required></textarea>
    </div>
    <button class="btn block" id="send" type="submit">Kirim pesan 🎁</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <section class="glass thanks" id="thanks">
    <div class="big">🥳</div>
    <h2>Tengkyu!</h2>
    <p>Pesanmu sudah terkirim! nanti aku baca.</p>
    <br>
    <button class="btn" id="again" type="button">Kirim pesan lagi</button>
  </section>
</main>

<button class="lock" id="lock" aria-label="Mode admin" title="Admin">🔒</button>

<!-- Password modal -->
<div class="overlay" id="pwOverlay">
  <div class="glass modal" id="pwBox">
    <h3>Mode Admin 🔐</h3>
    <input type="password" id="pw" placeholder="Masukkan password" aria-label="Password admin">
    <div class="err" id="pwErr"></div>
    <div class="row">
      <button class="btn ghost" id="pwCancel" type="button">Batal</button>
      <button class="btn" id="pwOk" type="button">Masuk</button>
    </div>
  </div>
</div>

<!-- Admin panel -->
<div class="admin" id="admin">
  <div class="admin-in">
    <div class="bar">
      <h2>Pesan masuk <span class="count" id="count">0</span></h2>
      <button class="btn ghost" id="logout" type="button">Keluar 👋</button>
    </div>
    <input class="search" id="search" placeholder="🔍 Cari nama atau isi pesan…" aria-label="Cari pesan">
    <div id="list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<script>
/* =========================================================
   KONFIGURASI FIREBASE
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBUHIeVd5S-rgmS6M1WRJk85S_HpX9peBQ",
  authDomain: "ucapan-102813.firebaseapp.com",
  projectId: "ucapan-102813",
  storageBucket: "ucapan-102813.firebasestorage.app",
  messagingSenderId: "708525552416",
  appId: "1:708525552416:web:e87e76e379846fc3e9dd45"
};
const ADMIN_PASSWORD = "nadakaji";
const COLLECTION = "messages";

/* ---------- helper ---------- */
const $ = id => document.getElementById(id);
const demoMode = firebaseConfig.apiKey.startsWith("GANTI");

/* ---------- floating background ---------- */
(function(){
  const bg = $("bg"), colors = ["#ffc8dd","#bde0fe","#d7c6f5","#ffe5b4","#c8f2e1"];
  const stars = ["⭐","💖","☁️","✨","🎈","🧁","🌸","🎀"];
  for(let i=0;i<9;i++){
    const s=document.createElement("span"), size=70+Math.random()*130;
    s.className="blob";
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;`+
      `background:${colors[i%colors.length]};--d:${14+Math.random()*14}s;--l:${-Math.random()*20}s`;
    bg.appendChild(s);
  }
  for(let i=0;i<12;i++){
    const s=document.createElement("span");
    s.className="star";
    s.textContent=stars[i%stars.length];
    s.style.cssText=`--s:${20+Math.random()*26}px;left:${Math.random()*96}%;top:${Math.random()*92}%;`+
      `--d:${12+Math.random()*14}s;--l:${-Math.random()*20}s`;
    bg.appendChild(s);
  }
})();

/* ---------- data layer (Firestore / demo localStorage) ---------- */
let db = null, store;
if(!demoMode){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  store = {
    add: data => db.collection(COLLECTION).add({...data, createdAt: firebase.firestore.FieldValue.serverTimestamp()}),
    remove: id => db.collection(COLLECTION).doc(id).delete(),
    subscribe: cb => db.collection(COLLECTION).orderBy("createdAt","desc").onSnapshot(
      snap => cb(snap.docs.map(d => ({id:d.id, ...d.data(), ts: d.data().createdAt ? d.data().createdAt.toMillis() : Date.now()}))),
      e => { 
        $("list").innerHTML = ""; 
        const p=document.createElement("div"); 
        p.className="empty"; 
        p.textContent="Gagal membaca data: "+e.message; 
        if(e.message.includes("permission")){
           p.innerHTML += "<br><br><b>Perhatian:</b> Aturan Firestore (Rules) kamu belum di-set ke Publik. Pastikan rules sudah disetel 'allow read, write: if true;' di console Firebase.";
        }
        $("list").appendChild(p); 
      }
    )
  };
}else{
  $("demo").style.display = "block";
  const KEY="bday_demo_msgs", read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
  const subs=[], emit=()=>subs.forEach(cb=>cb(read().sort((a,b)=>b.ts-a.ts)));
  store = {
    add: async data => { const l=read(); l.push({...data,id:"m"+Date.now(),ts:Date.now()}); localStorage.setItem(KEY,JSON.stringify(l)); emit(); },
    remove: async id => { localStorage.setItem(KEY,JSON.stringify(read().filter(m=>m.id!==id))); emit(); },
    subscribe: cb => { subs.push(cb); cb(read().sort((a,b)=>b.ts-a.ts)); return ()=>{}; }
  };
} // <-- INI DIA KURUNG PENUTUP YANG HILANG SEBELUMNYA!

/* ---------- confetti ---------- */
function boom(){
  if (typeof confetti !== "function") return; 
  
  const colors=["#ff8fb8","#bde0fe","#d7c6f5","#ffe5b4","#c8f2e1"];
  confetti({particleCount:140,spread:90,origin:{y:.65},colors,scalar:1.1});
  setTimeout(()=>confetti({particleCount:60,angle:60,spread:60,origin:{x:0,y:.7},colors}),200);
  setTimeout(()=>confetti({particleCount:60,angle:120,spread:60,origin:{x:1,y:.7},colors}),350);
}

$("cake").onclick = boom;

/* ---------- submit form ---------- */
$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("send"), err=$("err");
  err.textContent="";
  const data={
    name:$("name").value.trim(), wish:$("wish").value.trim(),
    like:$("like").value.trim(), dislike:$("dislike").value.trim()
  };
  if(!data.name||!data.wish||!data.like||!data.dislike){ err.textContent="Lengkapi semua kolom dulu ya."; return; }
  btn.disabled=true; btn.textContent="Mengirim… ✈️";
  try{
    await store.add(data);
    boom();
    $("form").style.display="none"; $("thanks").style.display="block";
    $("form").reset();
  }catch(ex){
    let msg = "Pesan belum terkirim: " + ex.message;
    if(ex.message.includes("permission")){
        msg = "Gagal kirim! Kamu belum mengubah Aturan (Rules) Firebase menjadi 'allow read, write: if true;'.";
    }
    err.textContent=msg;
  }finally{
    btn.disabled=false; btn.textContent="Kirim pesan 🎁";
  }
});
$("again").onclick=()=>{ $("thanks").style.display="none"; $("form").style.display="block"; $("name").focus(); };

/* ---------- admin ---------- */
let messages=[], unsub=null;
const pwOverlay=$("pwOverlay");
$("lock").onclick=()=>{ pwOverlay.classList.add("open"); $("pw").value=""; $("pwErr").textContent=""; setTimeout(()=>$("pw").focus(),50); };
$("pwCancel").onclick=()=>pwOverlay.classList.remove("open");
pwOverlay.addEventListener("click",e=>{ if(e.target===pwOverlay) pwOverlay.classList.remove("open"); });
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("pwOk").click(); });
$("pwOk").onclick=()=>{
  if($("pw").value===ADMIN_PASSWORD){
    pwOverlay.classList.remove("open");
    $("admin").classList.add("open");
    document.body.style.overflow="hidden";
    if(!unsub){ unsub=store.subscribe(list=>{ messages=list; render(); }); }
  }else{
    $("pwErr").textContent="Password salah, coba lagi.";
    const b=$("pwBox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }
};
$("logout").onclick=()=>{ $("admin").classList.remove("open"); document.body.style.overflow=""; $("search").value=""; };
$("search").addEventListener("input",render);

function block(cls,title,text){
  const d=document.createElement("div"); d.className="q "+cls;
  const s=document.createElement("small"); s.textContent=title;
  d.append(s,document.createTextNode(text)); return d;
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const list=messages.filter(m=>!q||[m.name,m.wish,m.like,m.dislike].some(v=>(v||"").toLowerCase().includes(q)));
  $("count").textContent=messages.length;
  const box=$("list"); box.replaceChildren();
  if(!list.length){
    const e=document.createElement("div"); e.className="empty";
    e.textContent=messages.length?"Tidak ada pesan yang cocok dengan pencarianmu.":"Belum ada pesan. Bagikan link ini ke teman-temanmu!";
    box.appendChild(e); return;
  }
  list.forEach(m=>{
    const c=document.createElement("article"); c.className="glass card";
    const top=document.createElement("div"); top.className="top";
    const left=document.createElement("div");
    const n=document.createElement("div"); n.className="name"; n.textContent="💌 "+m.name;
    const t=document.createElement("div"); t.className="time"; t.textContent=new Date(m.ts).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
    left.append(n,t);
    const del=document.createElement("button"); del.className="btn danger"; del.type="button"; del.textContent="Hapus 🗑️";
    del.onclick=async()=>{
      if(!confirm("Hapus pesan dari "+m.name+"?")) return;
      try{ await store.remove(m.id); }catch(ex){ alert("Gagal menghapus: "+ex.message); }
    };
    top.append(left,del);
    c.append(top,
      block("wish","🎉 Ucapan",m.wish),
      block("like","💖 Yang disuka",m.like),
      block("dislike","🫠 Yang tidak disuka",m.dislike));
    box.appendChild(c);
  });
}
</script>
</body>
</html>
